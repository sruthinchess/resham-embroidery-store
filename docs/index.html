  }
  async function oOut(o, opts = {}) {
    const out = {
      id: o.id, code: o.code, name: o.name, email: o.email, phone: o.phone,
      items: o.items, amount: o.amount, status: o.status, note: o.note,
      upiRef: o.upi_ref, hasProof: !!o.screenshot, createdAt: o.created_at, paidAt: o.paid_at,
      subtotal: o.subtotal ?? o.amount, discount: o.discount || 0, coupon: o.coupon_code || null,
      upi: o.status === 'awaiting' ? upi(o) : null
    };
    if (opts.withLinks && o.status === 'paid') out.downloads = await linksFor(o, false);
    if (opts.admin) out.screenshotUrl = o.screenshot || null;
    return out;
  }
  const adminOK = () => { const t = LS.getItem('ra_admin_token'); return !!(t && S.adminSessions[t]); };
  const guard = () => { if (!adminOK()) throw fail('Admin session expired — sign in again.', 401); };

  const routes = [];
  const R = (m, p, fn) => routes.push({ m, parts: p.split('/').filter(Boolean), fn });

  R('GET', '/api/health', () => ({ ok: true, service: 'resham-demo' }));
  R('GET', '/api/settings', () => {
    const s = S.settings;
    return { ok: true, settings: { store_name: s.store_name, tagline: s.tagline, announcement: s.announcement,
      support_email: s.support_email, upi_id: s.upi_id, payee_name: s.payee_name,
      link_hours: Number(s.link_hours || 72), auto_approve: String(s.auto_approve) === '1' } };
  });
  R('GET', '/api/formats', () => ({ ok: true, formats: [
    { key: 'dst', label: 'DST', note: 'Tajima — most commercial machines' },
    { key: 'exp', label: 'EXP', note: 'Melco / Bernina' },
    { key: 'svg', label: 'SVG', note: 'Vector stitch paths' },
    { key: 'png', label: 'PNG', note: 'Stitch-out preview' },
    { key: 'pdf', label: 'PDF', note: 'Printable design sheet' }] }));

  R('GET', '/api/designs', (m, q) => {
    let list = S.designs.filter(d => d.active);
    if (q.featured === '1') list = list.filter(d => d.featured);
    if (q.q) { const t = q.q.toLowerCase(); list = list.filter(d => (d.name + ' ' + d.summary + ' ' + (d.tags || []).join(' ')).toLowerCase().includes(t)); }
    if (q.tag && q.tag !== 'all') list = list.filter(d => (d.tags || []).includes(q.tag));
    const sort = q.sort || 'featured';
    list.sort((a, b) => sort === 'price_asc' ? a.price - b.price : sort === 'price_desc' ? b.price - a.price
      : sort === 'stitches' ? b.stitchCount - a.stitchCount : sort === 'newest' ? b.id - a.id
      : sort === 'name' ? a.name.localeCompare(b.name) : (b.featured - a.featured) || (a.id - b.id));
    const tags = {};
    S.designs.filter(d => d.active).forEach(d => (d.tags || []).forEach(t => tags[t] = (tags[t] || 0) + 1));
    return { ok: true, designs: list, total: list.length, tags: Object.entries(tags).map(([tag, c]) => ({ tag, c })).sort((a, b) => b.c - a.c) };
  });
  R('GET', '/api/designs/:key', (m, q, p) => {
    const d = S.designs.find(x => x.active && (x.slug === p.key || String(x.id) === p.key));
    if (!d) throw fail('That design is not available.', 404);
    return { ok: true, design: d, related: S.designs.filter(x => x.active && x.id !== d.id).sort((a, b) => b.featured - a.featured).slice(0, 3) };
  });

  R('GET', '/api/coupons', () => ({ ok: true, coupons: S.coupons.filter(c => c.active).map(cOut) }));
  R('POST', '/api/coupons/validate', (m, q, p, b) => {
    const sub = Number(b.subtotal || 0);
    const r = checkCoupon(b.code, sub);
    return { ok: true, coupon: cOut(r.coupon), discount: r.discount, total: Math.max(0, sub - r.discount) };
  });

  R('POST', '/api/orders', (m, q, p, b) => {
    const items = b.items || [];
    if (!items.length) throw fail('Your bag is empty.');
    if (!String(b.name || '').trim()) throw fail('Please enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email || '')) throw fail('Please enter a valid email.');
    const lines = []; let amount = 0;
    for (const raw of items) {
      const d = S.designs.find(x => x.active && (String(x.id) === String(raw.id) || x.slug === raw.slug));
      if (!d) throw fail('One of the designs is no longer for sale.');
      if (lines.some(l => l.designId === d.id)) continue;
      const allowed = (d.formats || []).map(f => f.key);
      let formats = Array.isArray(raw.formats) ? raw.formats.filter(f => allowed.includes(f)) : [];
      if (!formats.length) formats = (d.defaultFormats && d.defaultFormats.length) ? d.defaultFormats.slice() : allowed.slice();
      const linePrice = Math.round(d.price * formats.length * 100) / 100;
      amount += linePrice;
      lines.push({ designId: d.id, slug: d.slug, name: d.name, price: linePrice, unitPrice: d.price, formats, stitchCount: d.stitchCount, hoop: d.hoop, preview: d.preview });
    }
    const subtotal = Math.round(amount * 100) / 100;
    let discount = 0, couponCode = null;
    if (b.coupon) {
      const r = checkCoupon(b.coupon, subtotal);
      discount = r.discount; couponCode = r.coupon.code; r.coupon.used++;
    }
    const o = {
      id: ++S.seq.order,
      code: 'SDY-' + Date.now().toString(36).toUpperCase().slice(-4) + Math.floor(Math.random() * 900 + 100),
      name: b.name.trim(), email: b.email.trim(), phone: (b.phone || '').trim(),
      items: lines, subtotal, discount, coupon_code: couponCode,
      amount: Math.max(0, Math.round((subtotal - discount) * 100) / 100), status: 'awaiting',
      upi_ref: '', screenshot: null, note: null, created_at: now(), paid_at: null
    };
    S.orders.unshift(o); save();
    return oOut(o).then(order => ({ ok: true, order }));
  });
  R('GET', '/api/orders/:code', (m, q, p) => {
    const o = S.orders.find(x => x.code.toUpperCase() === String(p.code).toUpperCase());
    if (!o) throw fail('No order with that code.', 404);
    return oOut(o, { withLinks: true }).then(order => ({ ok: true, order }));
  });
  R('POST', '/api/orders/:code/proof', (m, q, p, b) => {
    const o = S.orders.find(x => x.code.toUpperCase() === String(p.code).toUpperCase());
    if (!o) throw fail('Order not found.', 404);
    if (o.status === 'paid') return oOut(o, { withLinks: true }).then(order => ({ ok: true, order, message: 'Already confirmed.' }));
    const shot = String(b.screenshot || '');
    if (!/^data:image\/(png|jpe?g|webp|gif);base64,/.test(shot)) throw fail('Attach a screenshot image (PNG, JPG or WebP).');
    if (shot.length < 2000) throw fail('That image looks empty — attach the payment screenshot again.');
    const auto = String(S.settings.auto_approve) === '1';
    o.screenshot = shot; o.upi_ref = String(b.ref || '').slice(0, 60);
    o.status = auto ? 'paid' : 'submitted';
    o.paid_at = auto ? now() : null;
    o.note = auto ? 'Auto-confirmed from uploaded payment proof' : 'Awaiting manual check';
    save();
    return oOut(o, { withLinks: auto }).then(order => ({ ok: true, autoConfirmed: auto, order,
      message: auto ? 'Payment screenshot received — order confirmed.' : 'Screenshot received. The studio will confirm shortly.' }));
  });
  R('POST', '/api/orders/:code/links', (m, q, p) => {
    const o = S.orders.find(x => x.code.toUpperCase() === String(p.code).toUpperCase());
    if (!o) throw fail('Order not found.', 404);
    if (o.status !== 'paid') throw fail('This order is not confirmed yet.', 403);
    return linksFor(o, true).then(downloads => ({ ok: true, downloads }));
  });

  /* admin */
  R('POST', '/api/admin/login', (m, q, p, b) => {
    if (String(b.password || '') !== String(S.settings.admin_password || '252525')) throw fail('Wrong password. Try again.', 401);
    const t = 'adm' + Math.random().toString(36).slice(2);
    S.adminSessions[t] = true; LS.setItem('ra_admin_token', t); save();
    return { ok: true, token: t };
  });
  R('GET', '/api/admin/session', () => ({ ok: true, admin: adminOK() }));
  R('POST', '/api/admin/logout', () => { LS.removeItem('ra_admin_token'); return { ok: true }; });
  R('GET', '/api/admin/stats', async () => {
    guard();
    const paid = S.orders.filter(o => o.status === 'paid');
    const revenue = paid.reduce((s, o) => s + o.amount, 0);
    const series = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      series.push({ date: key, label: d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
        revenue: paid.filter(o => String(o.paid_at || '').slice(0, 10) === key).reduce((s, o) => s + o.amount, 0),
        orders: S.orders.filter(o => String(o.created_at).slice(0, 10) === key).length });
    }
    const sold = {}, fmt = {};
    paid.forEach(o => o.items.forEach(it => {
      sold[it.designId] = sold[it.designId] || { name: it.name, units: 0, revenue: 0 };
      sold[it.designId].units++; sold[it.designId].revenue += it.price;
      (it.formats || []).forEach(f => fmt[f] = (fmt[f] || 0) + 1);
    }));
    const c = s => S.orders.filter(o => o.status === s).length;
    return { ok: true, stats: {
      revenue, orders: S.orders.length, paid: paid.length, awaiting: c('awaiting'), submitted: c('submitted'), rejected: c('rejected'),
      aov: paid.length ? Math.round(revenue / paid.length) : 0,
      downloads: Object.keys(S.tokens).length, designs: S.designs.filter(d => d.active).length,
      series, topDesigns: Object.values(sold).sort((a, b) => b.units - a.units).slice(0, 5),
      coupons: paid.filter(o => o.coupon_code).reduce((acc, o) => { const u = acc.find(x => x.code === o.coupon_code); if (u) { u.n++; u.discount += o.discount || 0; } else acc.push({ code: o.coupon_code, n: 1, discount: o.discount || 0 }); return acc; }, []),
      discounted: paid.filter(o => o.coupon_code).length,
      formats: Object.entries(fmt).sort((a, b) => b[1] - a[1]).map(([key, n]) => ({ key, n })),
      recent: await Promise.all(S.orders.slice(0, 8).map(o => oOut(o, { admin: true }))) } };
  });
  R('GET', '/api/admin/orders', (m, q) => {
    guard();
    const list = q.status && q.status !== 'all' ? S.orders.filter(o => o.status === q.status) : S.orders;
    return Promise.all(list.map(o => oOut(o, { admin: true, withLinks: true }))).then(orders => ({ ok: true, orders }));
  });
  R('PATCH', '/api/admin/orders/:id', (m, q, p, b) => {
    guard();
    const o = S.orders.find(x => String(x.id) === String(p.id));
    if (!o) throw fail('Order not found.', 404);
    if (b.status) {
      if (!['awaiting', 'submitted', 'paid', 'rejected'].includes(b.status)) throw fail('Unknown status.');
      o.status = b.status;
      o.paid_at = b.status === 'paid' ? (o.paid_at || now()) : null;
    }
    if (b.note !== undefined) o.note = b.note;
    save();
    return oOut(o, { admin: true, withLinks: true }).then(order => ({ ok: true, order }));
  });
  R('GET', '/api/admin/designs', () => { guard(); return { ok: true, designs: S.designs.slice().reverse() }; });
  R('POST', '/api/admin/designs', () => { guard(); throw fail('New designs are imported with their machine files — run the import script.', 400); });
  R('PUT', '/api/admin/designs/:id', (m, q, p, b) => {
    guard();
    const d = S.designs.find(x => String(x.id) === String(p.id));
    if (!d) throw fail('Design not found.', 404);
    Object.assign(d, { name: b.name || d.name, price: Number(b.price || d.price), mrp: Number(b.mrp || d.mrp),
      summary: b.summary ?? d.summary, description: b.description ?? d.description, hoop: b.hoop ?? d.hoop,
      featured: b.featured ? 1 : 0, active: b.active === false ? 0 : 1 });
    save();
    return { ok: true, design: d };
  });
  R('DELETE', '/api/admin/designs/:id', (m, q, p) => {
    guard();
    const d = S.designs.find(x => String(x.id) === String(p.id));
    if (d) d.active = 0;
    save();
    return { ok: true, message: 'Design hidden from the store.' };
  });
  R('GET', '/api/admin/coupons', () => {
    guard();
    const usage = S.orders.filter(o => o.status === 'paid' && o.coupon_code)
      .reduce((acc, o) => { const u = acc.find(x => x.code === o.coupon_code); if (u) { u.n++; u.d += o.discount || 0; } else acc.push({ code: o.coupon_code, n: 1, d: o.discount || 0 }); return acc; }, []);
    return { ok: true, coupons: S.coupons.map(cOut), usage };
  });
  R('POST', '/api/admin/coupons', (m, q, p, b) => {
    guard();
    const code = String(b.code || '').trim().toUpperCase();
    if (!/^[A-Z0-9_-]{3,20}$/.test(code)) throw fail('Code must be 3–20 letters, numbers, - or _.');
    if (S.coupons.some(c => c.code.toUpperCase() === code)) throw fail('That code already exists.');
    if (!(Number(b.value) > 0)) throw fail('Value must be more than zero.');
    const c = { id: ++S.seq.coupon, code, type: b.type === 'flat' ? 'flat' : 'percent', value: Number(b.value),
      min_order: Number(b.minOrder || 0), max_uses: Number(b.maxUses || 0), used: 0,
      active: b.active === false ? 0 : 1, expires_at: b.expiresAt || null, note: b.note || '' };
    S.coupons.push(c); save();
    return { ok: true, coupon: cOut(c) };
  });
  R('PUT', '/api/admin/coupons/:id', (m, q, p, b) => {
    guard();
    const c = S.coupons.find(x => String(x.id) === String(p.id));
    if (!c) throw fail('Coupon not found.', 404);
    Object.assign(c, { type: b.type === 'flat' ? 'flat' : 'percent', value: Number(b.value),
      min_order: Number(b.minOrder || 0), max_uses: Number(b.maxUses || 0),
      active: b.active === false ? 0 : 1, expires_at: b.expiresAt || null, note: b.note || '' });
    save();
    return { ok: true, coupon: cOut(c) };
  });
  R('DELETE', '/api/admin/coupons/:id', (m, q, p) => {
    guard();
    S.coupons = S.coupons.filter(x => String(x.id) !== String(p.id)); save();
    return { ok: true, message: 'Coupon deleted.' };
  });

  R('GET', '/api/admin/settings', () => { guard(); const s = { ...S.settings }; delete s.admin_password; return { ok: true, settings: s }; });
  R('PUT', '/api/admin/settings', (m, q, p, b) => {
    guard();
    ['store_name', 'tagline', 'announcement', 'support_email', 'upi_id', 'payee_name', 'link_hours', 'auto_approve']
      .forEach(k => { if (b[k] !== undefined) S.settings[k] = b[k]; });
    save();
    return { ok: true, message: 'Settings saved.' };
  });
  R('POST', '/api/admin/password', (m, q, p, b) => {
    guard();
    if (String(b.current || '') !== String(S.settings.admin_password)) throw fail('Current password is incorrect.');
    if (String(b.next || '').length < 4) throw fail('New password needs at least 4 characters.');
    S.settings.admin_password = String(b.next);
    S.adminSessions = {}; LS.removeItem('ra_admin_token'); save();
    return { ok: true, message: 'Password updated.' };
  });

  function handle(method, path, body, query) {
    load();
    const [url, qstr] = path.split('?');
    const parts = url.split('/').filter(Boolean);
    query = { ...Object.fromEntries(new URLSearchParams(qstr || '')), ...(query || {}) };
    for (const r of routes) {
      if (r.m !== method || r.parts.length !== parts.length) continue;
      const params = {};
      let match = true;
      for (let i = 0; i < parts.length; i++) {
        const a = r.parts[i];
        if (a.startsWith(':')) params[a.slice(1)] = decodeURIComponent(parts[i]);
        else if (a !== parts[i]) { match = false; break; }
      }
      if (!match) continue;
      return r.fn(method, query, params, body || {});
    }
    const e = new Error('Unknown API route: ' + method + ' ' + url); e.__code = 404; throw e;
  }

  window.Demo = { handle, reset, get state() { return load(); } };
})();

</script>
<script>
/* =========================================================================
   Sandya Emb Designs — storefront
   Embroidery designs · machine-format selection · UPI QR + app deep links
   ========================================================================= */
(function () {
  'use strict';

  const LS = (function () {
    try { const k = '__ra_probe'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return window.localStorage; }
    catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
  })();

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
  const qs = o => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const nf = n => Number(n || 0).toLocaleString('en-IN');
  const dt = s => { const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); };

  /* ------------------------------------------------------------------ state */
  const Store = {
    settings: { store_name: 'Sandya Emb Designs', upi_id: '6301928345@fam', payee_name: 'Sandya Emb Designs', auto_approve: true, link_hours: 72 },
    designs: [], tags: [], formats: [], demo: false,
    cart: JSON.parse(LS.getItem('sd_cart') || LS.getItem('ra_cart') || '[]'),
    coupon: JSON.parse(LS.getItem('sd_coupon') || 'null'),
    wish: JSON.parse(LS.getItem('sd_wish') || '[]'),
    recent: JSON.parse(LS.getItem('sd_recent') || '[]'),
    save() {
      LS.setItem('sd_cart', JSON.stringify(this.cart));
      LS.setItem('sd_coupon', JSON.stringify(this.coupon));
      LS.setItem('sd_wish', JSON.stringify(this.wish));
      LS.setItem('sd_recent', JSON.stringify(this.recent));
      paintBadges();
    },
    get count() { return this.cart.length; },
    get subtotal() { return this.cart.reduce((s, l) => s + l.price, 0); },
    /** local estimate of the coupon — the server recomputes it when the order is created */
    totals() {
      const subtotal = this.subtotal;
      let discount = 0;
      const c = this.coupon;
      if (c) {
        const stillOk = (!c.minOrder || subtotal >= c.minOrder) && (!c.maxUses || c.used < c.maxUses);
        if (!stillOk) { this.coupon = null; this.save(); }
        else discount = Math.min(subtotal, Math.round((c.type === 'percent' ? subtotal * c.value / 100 : c.value) * 100) / 100);
      }
      return { subtotal, discount, total: Math.max(0, Math.round((subtotal - discount) * 100) / 100) };
    },
    isWished(id) { return this.wish.includes(id); },
    toggleWish(id) {
      this.wish = this.wish.includes(id) ? this.wish.filter(x => x !== id) : this.wish.concat(id);
      this.save();
      return this.wish.includes(id);
    },
    orders: JSON.parse(LS.getItem('sd_orders') || '[]'),
    rememberOrder(o) {
      if (!o || o.status !== 'paid') return;
      const entry = {
        code: o.code, email: o.email, amount: o.amount, paidAt: o.paidAt || new Date().toISOString(),
        items: (o.items || []).map(i => ({ name: i.name, formats: i.formats, preview: i.preview })),
        downloads: (o.downloads || []).map(d => ({ name: d.name, fileName: d.fileName, url: d.url }))
      };
      this.orders = [entry].concat(this.orders.filter(x => x.code !== o.code)).slice(0, 50);
      LS.setItem('sd_orders', JSON.stringify(this.orders));
    },
    pushRecent(slug) {
      this.recent = [slug].concat(this.recent.filter(x => x !== slug)).slice(0, 4);
      this.save();
    }
  };
  window.Store = Store;

  const CACHE = new Map();          // GET responses, so re-rendering a page costs nothing
  const CACHE_TTL = 30000;
  function bustCache() { CACHE.clear(); }

  async function api(path, opts = {}) {
    const method = opts.method || 'GET';
    if (method === 'GET' && !opts.fresh) {
      const hit = CACHE.get(path);
      if (hit && Date.now() - hit.at < CACHE_TTL) return hit.data;
    }
    const data = await apiFetch(path, opts, method);
    if (method === 'GET') CACHE.set(path, { at: Date.now(), data });
    else bustCache();
    return data;
  }

  async function apiFetch(path, opts, method) {
    if (Store.demo) { await new Promise(r => setTimeout(r, 40)); return window.Demo.handle(method, path, opts.body, opts.query); }
    const headers = { 'Content-Type': 'application/json' };
    if (opts.adminToken) headers['x-admin-token'] = opts.adminToken;
    let res;
    try { res = await fetch(path, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined }); }
    catch { throw new Error('Could not reach the server. Is it running?'); }
    const data = await res.json().catch(() => ({ ok: false, error: 'Unexpected response.' }));
    if (!res.ok || data.ok === false) { const e = new Error(data.error || 'Request failed'); e.status = res.status; throw e; }
    return data;
  }
  window.api = api;

  function toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = `<span>${kind === 'bad' ? '✕' : '✓'}</span><span>${esc(msg)}</span>`;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.25s'; }, 3000);
    setTimeout(() => el.remove(), 3300);
  }
  window.toast = toast;

  /* ------------------------------------------------------------------ icons */
  const I = {
    search: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>',

  function logo(app, h = 24) {

    if (!L) return `<span class="mono" style="font-size:11px">${esc(app.name)}</span>`;
    return `<svg viewBox="${L.viewBox}" height="${h}" role="img" aria-label="${esc(app.name)}" preserveAspectRatio="xMidYMid meet">${L.body}</svg>`;
  }

  /** Deep-links into the chosen UPI app, falling back to the generic sheet. */
  function openUpiApp(app, upi) {
    const query = (upi.link || '').split('?')[1] || '';
    const deep = query ? `${app.scheme}?${query}` : app.scheme;
    toast(`Opening ${app.name}…`);
    try {
      const ifr = document.createElement('iframe');
      ifr.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0';
      ifr.src = deep;
      document.body.appendChild(ifr);
      setTimeout(() => ifr.remove(), 1400);
    } catch (e) { /* ignore */ }
    // if the app did not take over, hand the user the generic UPI sheet
    setTimeout(() => {
      if (document.visibilityState === 'visible') window.location.href = upi.link;
    }, 1500);
  }
  window.openUpiApp = openUpiApp;

  async function viewDesign(slug) {
    const d = await api('/api/designs/' + encodeURIComponent(slug));
    const g = d.design;
    if (!Store.designs.some(x => x.slug === g.slug)) Store.designs.push(g);
    Store.pushRecent(g.slug);
    const keys = (g.formats || []).map(f => f.key);
    const chosen = (g.defaultFormats || []).filter(k => keys.includes(k)).slice(0, 1);
    const state = { formats: chosen.length ? chosen : keys.slice(0, 1) };

    setTimeout(() => {
      const box = $('#fmtBox');
      if (!box) return;
      const refresh = () => {
        $$('#fmtBox .fmt').forEach(b => b.classList.toggle('on', state.formats.includes(b.dataset.fmt)));
        const n = state.formats.length;
        const total = g.price * Math.max(1, n);
        $('#fmtCount').textContent = n ? `${n} format${n > 1 ? 's' : ''} · ${money(total)}` : 'Pick at least one format';
        $('#buyNow').disabled = !n;
        $('#buyNow').innerHTML = n ? `Buy now · ${money(total)}` : 'Pick a format';
        const pv = $('#pdpPrice'); if (pv) pv.textContent = money(total);
        const pn = $('#pdpPriceNote');
        if (pn) pn.textContent = n

            items: Store.cart.map(l => ({ id: l.id, formats: l.formats })), name: v.name, email: v.email,
            phone: v.phone || '', coupon: Store.coupon ? Store.coupon.code : null
          } });
          go('#/pay/' + res.order.code);

  async function viewPay(code, step) {

    return `<div class="wrap co-wrap"><div class="crumbs"><a href="#/">Home</a> / Order ${esc(d.order.code)}</div><div id="payRoot"></div></div>`;

  const rail = n => {
    const steps = [['Bag', 1], ['Details', 2], ['Pay by UPI', 3], ['Screenshot', 4]];
    return `<div class="co-steps">${steps.map(([label, i], idx) => {
      const cls = n > i ? 'done' : n === i ? 'on' : '';
      return `${idx ? `<div class="co-rail ${n > i ? 'fill' : ''}"></div>` : ''}
        <div class="co-step ${cls}"><i>${n > i ? '✓' : i}</i><span>${label}</span></div>`;
    }).join('')}</div>`;
  };

  function mountPay(o, step) {
    const root = $('#payRoot');
    if (!root) return;
    if (o.status === 'paid') { root.innerHTML = paidHTML(o); wirePaid(o); return; }
    if (o.status === 'submitted') { root.innerHTML = submittedHTML(o); return; }
    // once the buyer says they have paid, coming back lands on the upload step
    const paidFlag = LS.getItem('sd_paid_' + o.code) === '1';
    const wantUpload = step === 'upload' || (paidFlag && step !== 'pay');
    if (wantUpload) { root.innerHTML = uploadHTML(o); wireUpload(o); }
    else { root.innerHTML = payHTML(o); wirePay(o); }
  }

  function wireUpload(o) {
    const input = $('#proofInput');
    const zone = $('#dropZone');
    const back = $('#backToPay');
    if (back) back.onclick = () => { LS.removeItem('sd_paid_' + o.code); };
    if (!input) return;
    let file = null;
    const showPreview = f => {
      file = f;
      const url = URL.createObjectURL(f);
      const z = $('#dropZone');
      if (z) z.outerHTML = `<div class="proof-preview" id="dropZone">
        <img src="${url}" alt="Payment screenshot">
        <div><div class="fname">${esc(f.name)}</div><div class="small muted">ready to upload</div>
        <button class="btn btn-xs btn-ghost" id="rePick" style="margin-top:6px">Choose another</button></div>
      </div>`;
      const rp = $('#rePick'); if (rp) rp.onclick = () => input.click();
      const btn = $('#confirmPay'); if (btn) btn.disabled = false;
    };
    input.onchange = () => { if (input.files[0]) showPreview(input.files[0]); };
    if (zone) {
      zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag'); };
      zone.ondragleave = () => zone.classList.remove('drag');
      zone.ondrop = e => {
        e.preventDefault(); zone.classList.remove('drag');
        const f = e.dataTransfer.files[0];
        if (!f) return;
        if (!/^image\//.test(f.type)) return toast('Please drop an image file.', 'bad');
        showPreview(f);
      };
    }
    const btn = $('#confirmPay');
    if (btn) btn.onclick = () => {
      if (!file) return toast('Attach the payment screenshot first.', 'bad');
      if (file.size > 8 * 1024 * 1024) return toast('Screenshot is larger than 8 MB.', 'bad');

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const res = await api(`/api/orders/${encodeURIComponent(o.code)}/proof`, { method: 'POST', body: { screenshot: reader.result, ref: ($('#upiRef') || {}).value || '' } });

      };
      reader.onerror = () => { toast('Could not read that file.', 'bad'); btn.disabled = false; };
      reader.readAsDataURL(file);
    };
  }

  /* ----------------------------------------------------------------- QR */
  function qrSvg(text, cell = 6) {
    if (typeof window.qrcode !== 'function') return '<div class="small muted">QR unavailable</div>';
    try {
      const qr = window.qrcode(0, 'M');
      qr.addData(text); qr.make();
      return qr.createSvgTag({ cellSize: cell, margin: 2, scalable: true });
    } catch { return '<div class="small muted">QR unavailable</div>'; }
  }

  /* --------------------------------------------------------------- router */
  /* Real URLs: /designs, /design/peony-bloom, /pay/SDY-XXXX — not #/designs.
     BASE is injected by the page ('/' on the server, the repo path on Pages). */
  const BASE = (window.__BASE__ || '/').replace(/\/?$/, '/');
  const HASH_MODE = location.protocol === 'file:';

  function currentPath() {
    if (HASH_MODE) return location.hash.replace(/^#\/?/, '');
    let p = location.pathname || '/';
    if (p.startsWith(BASE)) p = p.slice(BASE.length);
    else p = p.replace(/^\//, '');
    return p.replace(/\/+$/, '');
  }

  function parseHash() {
    const raw = currentPath();
    const [p, q] = raw.split('?');
    const search = HASH_MODE ? q : (q || location.search.replace(/^\?/, ''));
    return { parts: (p || '').split('/').filter(Boolean), params: Object.fromEntries(new URLSearchParams(search || '')) };
  }

  function go(path, replace) {
    const clean = String(path).replace(/^#?\/*/, '');
    if (HASH_MODE) {
      if (location.hash === '#/' + clean) return;
      location.hash = '#/' + clean;
      return;
    }
    const url = BASE + clean;
    if (location.pathname + location.search === url) return;
    history[replace ? 'replaceState' : 'pushState']({}, '', url);
    render();
  }
  window.go = go;

  /* internal links keep their #/ href, but the address bar shows a clean URL */
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(2));
  });


  function reveals() {
    const els = $$('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('in'), i * 60);
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
    els.forEach(e => io.observe(e));
  }

  function progress(on) {
    let bar = document.getElementById('routebar');
    if (on) {
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'routebar';
        document.body.appendChild(bar);
      }
      bar.style.opacity = '1';
      bar.style.width = '0%';
      requestAnimationFrame(() => { bar.style.width = '72%'; });
    } else if (bar) {
      bar.style.width = '100%';
      setTimeout(() => { bar.style.opacity = '0'; }, 220);
      setTimeout(() => { bar.style.width = '0%'; }, 520);
    }
  }

  async function render() {
    progress(true);
    const { parts, params } = parseHash();
    const app = $('#app');
    const seg = parts[0] || 'home';
    if (seg === 'admin' && window.Admin) { window.Admin.render(app, parts.slice(1)); return; }

    let view = '', active = seg;
    try {
      if (seg === 'home') view = await viewHome();
      else if (seg === 'designs') view = await viewShop(params);
      else if (seg === 'd' || seg === 'design') view = await viewDesign(parts[1]);
      else if (seg === 'cart') view = await viewCart();
      else if (seg === 'saved') { view = await viewSaved(); active = 'saved'; }
      else if (seg === 'downloads') { view = await viewDownloads(); active = 'downloads'; }
      else if (seg === 'categories') { view = await viewCategories(); active = 'categories'; }
      else if (seg === 'about') { view = await viewAbout(); active = 'about'; }
      else if (seg === 'contact') { view = await viewContact(); active = 'contact'; }
      else if (seg === 'checkout') view = await viewCheckout();
      else if (seg === 'pay') view = await viewPay(parts[1], parts[2]);
      else if (seg === 'order') { view = await viewOrderLookup({ ...params, code: parts[1] }); active = 'order'; }
      else view = `<div class="wrap"><div class="empty" style="margin:50px 0"><h3>Page not found</h3><a class="btn btn-primary" href="#/" style="margin-top:8px">Go home</a></div></div>`;
    } catch (e) {
      view = `<div class="wrap"><div class="empty" style="margin:50px 0"><h3>Something went wrong</h3><p class="muted small">${esc(e.message)}</p><a class="btn btn-primary" href="#/" style="margin-top:8px">Back home</a></div></div>`;
    }

    app.innerHTML = header(active) + `<main class="page">${view}</main>` + footer() + tabbar(active);
    progress(false);
    closeDrawer();
    paintBadges();
    wireGlobal();
    reveals();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

            Store.save();
            m.classList.remove('on');
            toast(`${res.coupon.code} applied — you saved ${money(res.discount)}`, 'ok');
            render();
          } catch (err) { toast(err.message, 'bad'); }
        });
      } catch (e) { $('#offerList').innerHTML = `<p class="small muted">${esc(e.message)}</p>`; }
    };

    // coupon
    const cf = $('#couponForm');
    const applyCoupon = async () => {
      const input = cf && cf.querySelector('[name=code]');
      const code = (input ? input.value : '').trim();
      if (!code) return toast('Enter a coupon code', 'bad');
      try {
        const r = await api('/api/coupons/validate', { method: 'POST', body: { code, subtotal: Store.subtotal } });
        Store.coupon = { ...r.coupon, discount: r.discount };
        Store.save();
        toast(`${r.coupon.code} applied — you saved ${money(r.discount)}`, 'ok');
        render();
      } catch (err) { toast(err.message, 'bad'); }
    };
    if (cf) {
      const btn = $('#couponApply');
      if (btn) btn.onclick = applyCoupon;
      const input = cf.querySelector('[name=code]');
      if (input) input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } };
    }
    const cr = $('#couponRemove');
    if (cr) cr.onclick = () => { Store.coupon = null; Store.save(); toast('Coupon removed'); render(); };

    // welcome coupon
    const welcomeApply = $('#welcomeApply');
    if (welcomeApply) welcomeApply.onclick = async () => {
      if (!Store.cart.length) { toast('Add a design first, then apply WELCOME', 'bad'); go('#/designs'); return; }
      try {
        const r = await api('/api/coupons/validate', { method: 'POST', body: { code: 'WELCOME', subtotal: Store.subtotal } });
        Store.coupon = { ...r.coupon, discount: r.discount }; Store.save();
        toast(`WELCOME applied — ${money(r.discount)} off`, 'ok');
        go('#/cart');
      } catch (err) { toast(err.message, 'bad'); }
    };
    const welcomeClose = $('#welcomeClose');
    if (welcomeClose) welcomeClose.onclick = () => { LS.setItem('sd_welcome_off', '1'); render(); };

    // bundle
    const bundleAdd = $('#bundleAdd');
    if (bundleAdd) bundleAdd.onclick = async () => {
      Store.designs.forEach(d => {
        if (!Store.cart.some(l => l.id === d.id)) {
          Store.cart.push({ id: d.id, slug: d.slug, name: d.name, price: d.price, preview: d.preview,
            formats: d.defaultFormats && d.defaultFormats.length ? d.defaultFormats : (d.formats || []).map(f => f.key).slice(0, 2) });
        }
      });
      Store.save();
      try {
        const r = await api('/api/coupons/validate', { method: 'POST', body: { code: 'SET25', subtotal: Store.subtotal } });
        Store.coupon = { ...r.coupon, discount: r.discount };
        Store.save();
        toast(`Bundle added — ${money(r.discount)} off with SET25`, 'ok');
      } catch (err) { toast('Bundle added to your bag', 'ok'); }
      go('#/cart');
    };

    const chipsMore = $('#chipsMore');
    if (chipsMore) chipsMore.onclick = () => {
      $$('.filter-chip.extra').forEach(c => c.classList.remove('hide'));
      chipsMore.remove();
    };

    const loadMore = $('#loadMore');
    if (loadMore) loadMore.onclick = () => {
      const { params } = parseHash();
      go('#/designs?' + qs({ ...params, show: Number(params.show || PAGE) + PAGE }));
    };

    const sortSel = $('#sortSel');
    if (sortSel) sortSel.onchange = () => { const { params } = parseHash(); go('#/designs?' + qs({ ...params, sort: sortSel.value })); };
    const ff = $('#findForm');
    if (ff) ff.onsubmit = e => {
      e.preventDefault();
      const code = new FormData(ff).get('code').trim().toUpperCase();
      if (!code) return toast('Enter your order code', 'bad');
      go('#/pay/' + encodeURIComponent(code));
    };
    $$('[data-add]').forEach(b => b.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const d = await findDesign(Number(b.dataset.add));
      if (d) addToCart(d);
    });
    $$('[data-buy]').forEach(b => b.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const d = await findDesign(Number(b.dataset.buy));
      if (!d) return;
      const one = (d.defaultFormats && d.defaultFormats.length ? d.defaultFormats : (d.formats || []).map(f => f.key)).slice(0, 1);
      Store.cart = [{ id: d.id, slug: d.slug, name: d.name, price: d.price * one.length, unitPrice: d.price, preview: d.preview, formats: one }];
      Store.save(); go('#/checkout');
    });
    $$('[data-remove]').forEach(b => b.onclick = () => {
      Store.cart = Store.cart.filter(l => l.id !== Number(b.dataset.remove)); Store.save(); render();
    });
  }

  async function findDesign(id) {
    const d = Store.designs.find(x => x.id === id);
    if (d) return d;
    try { const r = await api('/api/designs/' + id); return r.design; } catch { toast('Could not load that design', 'bad'); return null; }
  }

  /* ------------------------------------------------------------------ boot */
  async function boot() {
    try { const r = await fetch('/api/health', { cache: 'no-store' }); if (!r.ok) throw 0; }
    catch { Store.demo = true; }
    if (Store.demo) {
      const b = document.createElement('div');
      b.className = 'mode-badge';
      b.textContent = 'Demo · data in this browser';
      b.title = 'Static demo: PES and DST are included here. Run npm start for the full store with all five formats and a real database.';
      document.body.appendChild(b);
    }
    try {
      const [s, p, f] = await Promise.all([api('/api/settings'), api('/api/designs?' + qs({})), api('/api/formats')]);
      Store.settings = { ...Store.settings, ...s.settings };
      Store.designs = p.designs; Store.tags = p.tags || [];
      Store.formats = f.formats || [];
    } catch (e) { console.warn(e); }

    window.addEventListener('hashchange', render);
    window.addEventListener('popstate', render);
    window.addEventListener('scroll', () => {
      const h = $('#hdr'); if (h) h.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });
    $('#scrim').onclick = () => { closeDrawer(); $('#modal').classList.remove('on'); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); $('#modal').classList.remove('on'); } });
    await render();
  }

  window.Router = { render, parseHash };
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
<script>
/* =========================================================================
   admin.js — studio admin (#/admin). Password 252525.
   ========================================================================= */
(function () {
  'use strict';
  const LS = (function () {
    try { const k = '__raa'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return window.localStorage; }
    catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
  })();
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
  const nf = n => Number(n || 0).toLocaleString('en-IN');
  const dt = s => { const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); };
  const AK = 'ra_admin_token';
  const Store = window.Store;

  async function adminApi(path, opts = {}) {
    const method = opts.method || 'GET';
    if (Store.demo) { await new Promise(r => setTimeout(r, 70)); return window.Demo.handle(method, path, opts.body, opts.query); }
    const headers = { 'Content-Type': 'application/json', 'x-admin-token': LS.getItem(AK) || '' };
    const res = await fetch(path, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const data = await res.json().catch(() => ({ ok: false, error: 'Unexpected response.' }));
    if (!res.ok || data.ok === false) throw new Error(data.error || 'Request failed');
    return data;
  }

  const MENU = [['dashboard', 'Dashboard', '◍'], ['orders', 'Orders', '▤'], ['designs', 'Designs', '❖'], ['coupons', 'Coupons', '⌗'], ['settings', 'Settings', '⚙']];

  function loginView(msg = '') {
    return `<div class="admin-login"><div class="login-card">
      <div style="text-align:center">
        <img class="brand-logo" src="${esc(Store.settings.logo_url || 'img/logo.png')}" alt="">
        <span class="eyebrow" style="justify-content:center">Studio admin</span>
        <h1 style="margin-top:8px">${esc(Store.settings.store_name)}</h1>
        <p class="small muted">Enter the 6-digit studio password.</p>
      </div>
      <div class="pw-dots" id="dots">${[0, 1, 2, 3, 4, 5].map(i => `<i data-i="${i}"></i>`).join('')}</div>
      <p class="err center" id="loginErr" style="min-height:18px">${esc(msg)}</p>
      <div class="keypad" id="keypad">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="clear" style="font-size:12px">Clear</button><button data-k="0">0</button>
        <button data-k="enter" style="background:var(--maroon);color:#fff;border-color:var(--maroon)">→</button>
      </div>
      <p class="small muted center" style="margin-top:14px">Default password <b>252525</b> — change it in Settings.</p>
      <a class="btn btn-ghost btn-block btn-sm" href="#/" style="margin-top:10px">← Back to the store</a>
    </div></div>`;
  }

  function wireLogin(rerender) {
    let buf = '';
    const paint = () => $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < buf.length));
    const submit = async () => {
      const err = $('#loginErr'); err.textContent = '';
      try {
        const r = await adminApi('/api/admin/login', { method: 'POST', body: { password: buf } });
        LS.setItem(AK, r.token); window.toast('Welcome back', 'ok'); rerender();
      } catch (e) { err.textContent = e.message; buf = ''; paint(); }
    };
    $$('#keypad button').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'clear') buf = '';
      else if (k === 'enter') { submit(); return; }
      else if (buf.length < 6) buf += k;
      paint();
      if (buf.length === 6) setTimeout(submit, 160);
    });
    const onKey = e => {
      if (/^[0-9]$/.test(e.key) && buf.length < 6) { buf += e.key; paint(); if (buf.length === 6) setTimeout(submit, 160); }
      else if (e.key === 'Backspace') { buf = buf.slice(0, -1); paint(); }
      else if (e.key === 'Enter') submit();
    };
    document.addEventListener('keydown', onKey);
    window.__offKey = () => document.removeEventListener('keydown', onKey);
  }

  function shell(section) {
    return `<div class="admin">
      <aside class="side">
        <div class="brand"><img src="${esc(Store.settings.logo_mark_url || 'img/logo-mark.png')}" alt="">${esc(String(Store.settings.store_name || '').split(' ')[0])}</div>
        ${MENU.map(([k, label, ic]) => `<a href="#/admin/${k}" class="${section === k ? 'on' : ''}"><span style="width:14px;text-align:center">${ic}</span>${label}</a>`).join('')}
        <div class="sep"></div>
        <a href="#/"><span style="width:14px;text-align:center">↗</span>View store</a>
        <a href="#" id="adminOut"><span style="width:14px;text-align:center">⏻</span>Sign out</a>
        <div class="side-foot">${Store.demo ? 'Demo · browser storage' : 'Connected · SQLite'}</div>
      </aside>
      <main class="amain" id="adminBody"><p class="muted small">Loading…</p></main>
    </div>`;
  }

  async function sectionDashboard() {
    const { stats } = await adminApi('/api/admin/stats');
    const max = Math.max(1, ...stats.series.map(d => d.revenue));
    const chart = stats.revenue === 0
      ? `<div style="height:140px;display:grid;place-items:center;border:1px dashed var(--line-strong);border-radius:10px;color:var(--ink-mute);font-size:13px">No confirmed payments yet — they chart here.</div>`
      : `<svg class="sparkline" viewBox="0 0 700 140" preserveAspectRatio="none">
          ${stats.series.map((d, i) => `<rect x="${i * 50 + 8}" y="${130 - (d.revenue / max) * 110}" width="34" height="${(d.revenue / max) * 110 + 1}" rx="3" fill="${d.revenue ? 'var(--maroon)' : '#e9e2d4'}"/>`).join('')}
          ${stats.series.map((d, i) => i % 2 === 0 ? `<text x="${i * 50 + 25}" y="139" font-size="9" fill="#8c8177" text-anchor="middle">${d.label}</text>` : '').join('')}
        </svg>`;
    const fmtMax = Math.max(1, ...(stats.formats || []).map(f => f.n));
    return `<div class="ahead"><div><h1>Dashboard</h1><p class="muted small" style="margin:2px 0 0">UPI at ${esc(Store.settings.upi_id)} · auto-confirm ${Store.settings.auto_approve ? 'on' : 'off'}</p></div>
        <a class="btn btn-ghost btn-sm" href="#/">View store ↗</a></div>
      <div class="kpis">
        <div class="kpi"><span class="lab">Revenue</span><b>${money(stats.revenue)}</b><span class="delta">${stats.paid} confirmed</span></div>
        <div class="kpi"><span class="lab">Orders</span><b>${stats.orders}</b><span class="delta">${stats.awaiting} awaiting payment</span></div>
        <div class="kpi"><span class="lab">Avg. order</span><b>${money(stats.aov)}</b><span class="delta">${stats.designs} designs live</span></div>
        <div class="kpi"><span class="lab">Downloads</span><b>${stats.downloads}</b><span class="delta">${stats.submitted} proofs to review</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:14px">
        <div class="card"><div class="card-h"><h3>Revenue · 14 days</h3></div>${chart}</div>
        <div class="card"><h3>Coupons</h3>
          ${(stats.coupons && stats.coupons.length)
            ? stats.coupons.map(c => `<div class="between" style="padding:5px 0;border-bottom:1px solid var(--line-soft)">
                <span class="mono small">${esc(c.code)}</span><span class="small">${c.n}× · <b>${money(c.discount || 0)}</b></span></div>`).join('')
            : `<p class="muted small">No coupon redemptions yet.</p>`}
          <div class="between" style="margin-top:10px"><span class="small muted">Orders with a coupon</span><b class="small">${stats.discounted || 0}</b></div>
        </div>
        <div class="card"><h3>Formats bought</h3>
          ${(stats.formats && stats.formats.length) ? stats.formats.map(f => `<div style="margin-bottom:11px">
            <div class="between" style="margin-bottom:4px"><span class="small">${f.key.toUpperCase()}</span><b class="mono small">${f.n}</b></div>
            <div class="bar"><i style="width:${(f.n / fmtMax) * 100}%"></i></div></div>`).join('')
        : `<p class="muted small">No format data yet.</p>`}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
        <div class="card"><div class="card-h"><h3>Top designs</h3><a class="small link" href="#/admin/designs">All designs</a></div>
          ${stats.topDesigns.length ? `<div class="tbl-wrap"><table class="tbl"><tbody>
            ${stats.topDesigns.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.units}</td><td class="num"><b>${money(p.revenue)}</b></td></tr>`).join('')}
          </tbody></table></div>` : `<p class="muted small">No sales yet.</p>`}</div>
        <div class="card"><div class="card-h"><h3>Recent orders</h3><a class="small link" href="#/admin/orders">All orders →</a></div>
          ${ordersTable(stats.recent, true)}</div>
      </div>`;
  }

  function ordersTable(orders, compact) {
    if (!orders || !orders.length) return `<p class="muted small">No orders yet.</p>`;
    return `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Order</th><th>Buyer</th>${compact ? '' : '<th>Formats</th>'}<th>Placed</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${orders.map(o => `<tr>
        <td class="mono"><b>${esc(o.code)}</b></td>
        <td>${esc(o.name)}<div class="small muted">${esc(o.email)}</div></td>
        ${compact ? '' : `<td class="small mono">${o.items.map(i => (i.formats || []).map(f => f.toUpperCase()).join('+')).join(' ')}</td>`}
        <td class="small">${dt(o.createdAt)}</td>
        <td><span class="status-chip ${o.status}">${o.status}</span></td>
        <td class="num"><b>${money(o.amount)}</b></td>
        <td><button class="btn btn-xs btn-ghost" data-order="${o.id}">Open</button></td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  let orderFilter = 'all';
  async function sectionOrders() {
    const all = (await adminApi('/api/admin/orders')).orders;
    const list = orderFilter === 'all' ? all : all.filter(o => o.status === orderFilter);
    const counts = {};
    all.forEach(o => counts[o.status] = (counts[o.status] || 0) + 1);
    return `<div class="ahead"><div><h1>Orders</h1><p class="muted small" style="margin:2px 0 0">${list.length} shown · ${all.length} total</p></div></div>
      <div class="shopbar" style="border:0;padding:0 0 12px">
        <button class="filter-chip ${orderFilter === 'all' ? 'on' : ''}" data-of="all">All ${all.length}</button>
        ${['awaiting', 'submitted', 'paid', 'rejected'].map(s => `<button class="filter-chip ${orderFilter === s ? 'on' : ''}" data-of="${s}">${s} ${counts[s] || 0}</button>`).join('')}
      </div>
      <div class="card">${ordersTable(list, false)}</div>`;
  }

  function orderModal(o) {
    return `<div class="modal" style="width:min(680px,100%)">
      <header><div><span class="eyebrow">${esc(o.code)}</span><h3 style="margin-top:2px">${esc(o.name)}</h3></div>
        <button class="icon-btn" id="mClose">✕</button></header>
      <div class="between" style="margin-bottom:12px"><span class="status-chip ${o.status}">${o.status}</span>
        <span class="small muted mono">${money(o.amount)} · ${dt(o.createdAt)}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="card" style="padding:13px"><span class="lab small muted">Buyer</span>
          <p class="small" style="margin:6px 0 0">${esc(o.name)}<br>${esc(o.email)}<br>${esc(o.phone || '—')}</p></div>
        <div class="card" style="padding:13px"><span class="lab small muted">Payment</span>
          <p class="small" style="margin:6px 0 0">UPI ${esc(Store.settings.upi_id)}<br>Ref: ${esc(o.upiRef || '—')}<br>${o.paidAt ? 'Paid ' + dt(o.paidAt) : 'Not paid yet'}</p></div>
      </div>
      <div class="card" style="padding:13px;margin-top:10px"><span class="lab small muted">Designs &amp; formats</span>
        ${o.items.map(i => `<div class="between small" style="padding:5px 0;border-bottom:1px solid var(--line-soft)">
          <span>${esc(i.name)}</span><span class="mono">${(i.formats || []).map(f => f.toUpperCase()).join(' · ')}</span></div>`).join('')}
      </div>
      ${o.hasProof ? `<div class="card" style="padding:13px;margin-top:10px">
          <div class="between"><span class="lab small muted">Payment screenshot</span>
            <a class="small link" href="${esc(o.screenshotUrl)}" target="_blank" rel="noopener">Open full size ↗</a></div>
          <img src="${esc(o.screenshotUrl)}" alt="Payment proof" style="width:100%;max-height:280px;object-fit:contain;margin-top:10px;border-radius:8px;border:1px solid var(--line);background:#fff">
        </div>` : `<p class="small muted" style="margin-top:10px">No screenshot uploaded yet.</p>`}
      <div class="row" style="margin-top:14px;flex-wrap:wrap">
        ${o.status !== 'paid' ? `<button class="btn btn-green btn-sm" data-set="paid">Confirm payment</button>` : ''}
        ${o.status !== 'rejected' ? `<button class="btn btn-ghost btn-sm" data-set="rejected">Reject</button>` : ''}
        ${o.status === 'rejected' ? `<button class="btn btn-ghost btn-sm" data-set="awaiting">Reset to awaiting</button>` : ''}
      </div>
    </div>`;
  }

  async function sectionCoupons() {
    const { coupons, usage } = await adminApi('/api/admin/coupons');
    const useOf = code => (usage || []).find(u => u.code === code) || { n: 0, d: 0 };
    return `<div class="ahead"><div><h1>Coupons</h1>
        <p class="muted small" style="margin:2px 0 0">${coupons.filter(c => c.active).length} active · ${coupons.reduce((s, c) => s + c.used, 0)} redemptions</p></div>
        <button class="btn btn-primary btn-sm" id="newCoupon">+ New coupon</button></div>
      <div class="card"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Code</th><th>Offer</th><th>Min order</th><th class="num">Used</th><th class="num">Given away</th><th>Status</th><th></th></tr></thead>
        <tbody>${coupons.map(c => {
          const u = useOf(c.code);
          const status = !c.active ? 'paused' : c.expired ? 'expired' : c.exhausted ? 'used up' : 'active';
          return `<tr>
            <td class="mono"><b>${esc(c.code)}</b>${c.note ? `<div class="small muted">${esc(c.note)}</div>` : ''}</td>
            <td>${c.type === 'percent' ? c.value + '% off' : money(c.value) + ' off'}</td>
            <td>${c.minOrder ? money(c.minOrder) : '—'}</td>
            <td class="num">${c.used}${c.maxUses ? ' / ' + c.maxUses : ''}</td>
            <td class="num">${money(u.d || 0)}</td>
            <td><span class="status-chip ${status === 'active' ? 'paid' : 'rejected'}">${status}</span></td>
            <td style="white-space:nowrap"><button class="btn btn-xs btn-ghost" data-cedit="${c.id}">Edit</button>
              <button class="btn btn-xs btn-ghost" data-cdel="${c.id}">Delete</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`;
  }

  function couponForm(c) {
    const d = c || {};
    return `<div class="modal" style="width:min(520px,100%)">
      <header><div><span class="eyebrow">${d.id ? 'Edit' : 'New'} coupon</span><h3 style="margin-top:2px">${esc(d.code || 'Untitled')}</h3></div>
        <button class="icon-btn" id="mClose">✕</button></header>
      <form id="cForm" class="stack">
        ${d.id ? '' : `<div class="field"><label>Code</label><input class="input mono" name="code" placeholder="SANDYA10" style="text-transform:uppercase" required></div>`}
        <div class="grid-2">
          <div class="field"><label>Type</label><select class="select" name="type">
            <option value="percent" ${d.type !== 'flat' ? 'selected' : ''}>Percent off</option>
            <option value="flat" ${d.type === 'flat' ? 'selected' : ''}>Flat ₹ off</option></select></div>
          <div class="field"><label>Value</label><input class="input" name="value" type="number" min="1" value="${d.value || ''}" required></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Min order (₹)</label><input class="input" name="minOrder" type="number" min="0" value="${d.minOrder || 0}"></div>
          <div class="field"><label>Max uses (0 = none)</label><input class="input" name="maxUses" type="number" min="0" value="${d.maxUses || 0}"></div>
        </div>
        <div class="field"><label>Expires (optional)</label><input class="input" name="expiresAt" type="date" value="${d.expiresAt ? String(d.expiresAt).slice(0, 10) : ''}"></div>
        <div class="field"><label>Note</label><input class="input" name="note" value="${esc(d.note || '')}" placeholder="10% off orders over ₹999"></div>
        <label class="row small"><input type="checkbox" name="active" ${d.active !== false ? 'checked' : ''}> Active</label>
        <div class="row"><button class="btn btn-primary">${d.id ? 'Save coupon' : 'Create coupon'}</button>
          <button type="button" class="btn btn-ghost" id="mCancel">Cancel</button></div>
      </form></div>`;
  }

  async function sectionDesigns() {
    const { designs } = await adminApi('/api/admin/designs');
    return `<div class="ahead"><div><h1>Designs</h1><p class="muted small" style="margin:2px 0 0">${designs.filter(d => d.active).length} live · ${designs.filter(d => !d.active).length} hidden</p></div>
        <span class="small muted">New packs: <code class="mono">node tools/import-designs.js &lt;folder&gt;</code></span></div>
      <div class="card"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th></th><th>Design</th><th class="num">Stitches</th><th class="num">Size</th><th class="num">Price</th><th class="num">Sold</th><th>Status</th><th></th></tr></thead>
        <tbody>${designs.map(d => `<tr>
          <td><div style="width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;padding:3px">${d.preview ? `<img src="${esc(d.preview)}" alt="" style="width:100%;height:100%;object-fit:contain">` : ''}</div></td>
          <td><b>${esc(d.name)}</b><div class="small muted">${esc(d.hoop || '')} · ${(d.formats || []).length} formats · ${nf(d.trims)} trims</div></td>
          <td class="num">${nf(d.stitchCount)}</td>
          <td class="num small">${d.widthMm}×${d.heightMm}mm</td>
          <td class="num">${money(d.price)}</td>
          <td class="num">${d.downloads}</td>
          <td><span class="status-chip ${d.active ? 'paid' : 'rejected'}">${d.active ? 'live' : 'hidden'}</span></td>
          <td style="white-space:nowrap"><button class="btn btn-xs btn-ghost" data-edit="${d.id}">Edit</button>
            ${d.active ? `<button class="btn btn-xs btn-ghost" data-del="${d.id}">Hide</button>` : ''}</td>
        </tr>`).join('')}</tbody></table></div></div>`;
  }

  function designForm(d) {
    return `<div class="modal" style="width:min(620px,100%)">
      <header><div><span class="eyebrow">Edit design</span><h3 style="margin-top:2px">${esc(d.name || '')}</h3></div>
        <button class="icon-btn" id="mClose">✕</button></header>
      <form id="dForm" class="stack">
        <div class="grid-2">
          <div class="field"><label>Name</label><input class="input" name="name" value="${esc(d.name || '')}" required></div>
          <div class="field"><label>Hoop</label><input class="input" name="hoop" value="${esc(d.hoop || '')}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Price (₹)</label><input class="input" name="price" type="number" min="1" value="${d.price || ''}" required></div>
          <div class="field"><label>MRP (₹)</label><input class="input" name="mrp" type="number" min="0" value="${d.mrp || ''}"></div>
        </div>
        <div class="field"><label>Summary</label><input class="input" name="summary" value="${esc(d.summary || '')}"></div>
        <div class="field"><label>Description</label><textarea class="textarea" name="description">${esc(d.description || '')}</textarea></div>
        <div class="grid-2">
          <div class="field"><label>Tags</label><input class="input" name="tags" value="${esc((d.tags || []).join(', '))}"></div>
          <div class="field"><label>Badge</label><input class="input" name="badge" value="${esc(d.badge || '')}" placeholder="New / Bestseller"></div>
        </div>
        <label class="row small"><input type="checkbox" name="featured" ${d.featured ? 'checked' : ''}> Feature on the home page</label>
        <label class="row small"><input type="checkbox" name="active" ${d.active !== false ? 'checked' : ''}> Visible in the store</label>
        <div class="row"><button class="btn btn-primary">Save changes</button>
          <button type="button" class="btn btn-ghost" id="mCancel">Cancel</button></div>
        <p class="small muted" style="margin:0">${nf(d.stitchCount)} stitches · ${d.widthMm}×${d.heightMm} mm · ${d.colorCount} colours · ${nf(d.trims)} trims · ${(d.formats || []).length} machine formats — all read from the design files.</p>
      </form></div>`;
  }

  async function sectionSettings() {
    const { settings } = await adminApi('/api/admin/settings');
    return `<div class="ahead"><div><h1>Settings</h1><p class="muted small" style="margin:2px 0 0">Payment, delivery and the studio password</p></div></div>
      <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start">
        <div class="card"><h3>Payment &amp; delivery</h3>
          <form id="sForm" class="stack">
            <div class="grid-2">
              <div class="field"><label>UPI ID</label><input class="input mono" name="upi_id" value="${esc(settings.upi_id || '')}"></div>
              <div class="field"><label>Payee name</label><input class="input" name="payee_name" value="${esc(settings.payee_name || '')}"></div>
            </div>
            <div class="grid-3">
              <div class="field"><label>Price per 1,000 stitches (₹)</label><input class="input" name="price_per_1k_stitches" type="number" min="1" value="${settings.price_per_1k_stitches || 50}"></div>
              <div class="field"><label>Min price (₹)</label><input class="input" name="min_price" type="number" min="0" value="${settings.min_price || 60}"></div>
              <div class="field"><label>Max price (₹)</label><input class="input" name="max_price" type="number" min="1" value="${settings.max_price || 500}"></div>
            </div>
            <p class="small muted" style="margin:-6px 0 0">A design costs its stitches ÷ 1,000 × this rate, kept between the min and max. Re-run <code class="mono">node tools/import-designs.js &lt;pack folders&gt;</code> after changing the rate to reprice the catalogue.</p>
            <div class="grid-2">
              <div class="field"><label>Link valid (hours)</label><input class="input" name="link_hours" type="number" min="1" value="${settings.link_hours || 72}"></div>
              <div class="field"><label>Store name</label><input class="input" name="store_name" value="${esc(settings.store_name || '')}"></div>
            </div>
            <div class="field"><label>Support email</label><input class="input" name="support_email" value="${esc(settings.support_email || '')}"></div>
            <div class="field"><label>Announcement bar</label><input class="input" name="announcement" value="${esc(settings.announcement || '')}"></div>
            <label class="row small" style="align-items:flex-start;gap:9px">
              <input type="checkbox" name="auto_approve" ${String(settings.auto_approve) === '1' ? 'checked' : ''} style="margin-top:3px">
              <span><b>Auto-confirm on screenshot upload</b><br><span class="muted">Any uploaded screenshot marks the order paid and releases the files. Turn off to check each payment by hand in Orders.</span></span></label>
            <button class="btn btn-primary">Save settings</button>
          </form>
        </div>
        <div class="stack">
          <div class="card"><h3>Studio password</h3>
            <form id="pwForm" class="stack">
              <div class="field"><label>Current</label><input class="input" name="current" type="password" placeholder="••••••"></div>
              <div class="field"><label>New</label><input class="input" name="next" type="password" placeholder="At least 4 characters"></div>
              <button class="btn btn-dark">Update password</button>
            </form>
          </div>
          <div class="card"><h3>Danger zone</h3>
            <p class="small muted">Reset the demo catalogue and clear every order.</p>
            ${Store.demo ? `<button class="btn btn-ghost btn-sm" id="resetDemo">Reset demo data</button>` : `<p class="small muted">Run <code class="mono">npm run reset</code> in the project folder.</p>`}
          </div>
        </div>
      </div>`;
  }

  let section = 'dashboard';
  async function render(app, parts) {
    section = parts[0] || 'dashboard';
    if (window.__offKey) { window.__offKey(); window.__offKey = null; }
    if (!LS.getItem(AK)) { app.innerHTML = loginView(); wireLogin(() => render(app, parts)); return; }
    try { const s = await adminApi('/api/admin/session'); if (!s.admin) throw new Error('expired'); }
    catch { LS.removeItem(AK); app.innerHTML = loginView('Session expired — sign in again.'); wireLogin(() => render(app, parts)); return; }

    app.innerHTML = shell(section);
    const body = $('#adminBody');
    $('#adminOut').onclick = async e => {
      e.preventDefault();
      try { await adminApi('/api/admin/logout', { method: 'POST' }); } catch {}
      LS.removeItem(AK); window.toast('Signed out'); render(app, []);
    };
    try {
      if (section === 'dashboard') body.innerHTML = await sectionDashboard();
      else if (section === 'orders') body.innerHTML = await sectionOrders();
      else if (section === 'designs') body.innerHTML = await sectionDesigns();
      else if (section === 'coupons') body.innerHTML = await sectionCoupons();
      else if (section === 'settings') body.innerHTML = await sectionSettings();
      else body.innerHTML = await sectionDashboard();
    } catch (e) {
      body.innerHTML = `<div class="card"><h3>Could not load this view</h3><p class="muted small">${esc(e.message)}</p></div>`;
      return;
    }
    wire(body, app, parts);
  }

  function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
  function openModal(html) {
    const m = $('#modal');
    m.innerHTML = html; m.classList.add('on');
    m.onclick = e => { if (e.target === m) closeModal(); };
    const c = $('#mClose'); if (c) c.onclick = closeModal;
    const x = $('#mCancel'); if (x) x.onclick = closeModal;
  }

  function wire(body, app, parts) {
    const rerender = () => render(app, parts);
    body.querySelectorAll('[data-of]').forEach(b => b.onclick = () => { orderFilter = b.dataset.of; rerender(); });

    body.querySelectorAll('[data-order]').forEach(b => b.onclick = async () => {
      const { orders } = await adminApi('/api/admin/orders');
      const o = orders.find(x => x.id === Number(b.dataset.order));
      if (!o) return;
      openModal(orderModal(o));
      $('#modal').querySelectorAll('[data-set]').forEach(x => x.onclick = async () => {
        const status = x.dataset.set;
        if (status === 'rejected' && !confirm('Reject this order?')) return;
        try {
          await adminApi('/api/admin/orders/' + o.id, { method: 'PATCH', body: { status } });
          window.toast(`Order ${o.code} → ${status}`, 'ok'); closeModal(); rerender();
        } catch (e) { window.toast(e.message, 'bad'); }
      });
    });

    const addDesign = async (d) => {
      openModal(designForm(d || {}));
      $('#dForm').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const payload = {
          name: f.get('name'), hoop: f.get('hoop'), price: Number(f.get('price')), mrp: Number(f.get('mrp') || f.get('price')),
          summary: f.get('summary'), description: f.get('description'), active: !!f.get('active'),
          tags: String(f.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean),
          badge: f.get('badge') || null, featured: !!f.get('featured')
        };
        try {
          await adminApi('/api/admin/designs/' + d.id, { method: 'PUT', body: payload });
          window.toast(d && d.id ? 'Design saved' : 'Design created', 'ok'); closeModal(); rerender();
        } catch (err) { window.toast(err.message, 'bad'); }
      };
    };
    body.querySelectorAll('[data-edit]').forEach(b => b.onclick = async () => {
      const { designs } = await adminApi('/api/admin/designs');
      addDesign(designs.find(d => d.id === Number(b.dataset.edit)));
    });
    body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Hide this design from the store?')) return;
      await adminApi('/api/admin/designs/' + b.dataset.del, { method: 'DELETE' });
      window.toast('Design hidden'); rerender();
    });

    const openCoupon = c => {
      openModal(couponForm(c));
      $('#cForm').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const body = {
          type: f.get('type'), value: Number(f.get('value')), minOrder: Number(f.get('minOrder') || 0),
          maxUses: Number(f.get('maxUses') || 0), expiresAt: f.get('expiresAt') || null,
          note: f.get('note') || '', active: !!f.get('active')
        };
        try {
          if (c && c.id) await adminApi('/api/admin/coupons/' + c.id, { method: 'PUT', body });
          else await adminApi('/api/admin/coupons', { method: 'POST', body: { ...body, code: f.get('code') } });
          window.toast('Coupon saved', 'ok'); closeModal(); rerender();
        } catch (err) { window.toast(err.message, 'bad'); }
      };
    };
    const nc = $('#newCoupon'); if (nc) nc.onclick = () => openCoupon(null);
    body.querySelectorAll('[data-cedit]').forEach(b => b.onclick = async () => {
      const { coupons } = await adminApi('/api/admin/coupons');
      openCoupon(coupons.find(c => c.id === Number(b.dataset.cedit)));
    });
    body.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this coupon?')) return;
      await adminApi('/api/admin/coupons/' + b.dataset.cdel, { method: 'DELETE' });
      window.toast('Coupon deleted'); rerender();
    });

    const sf = $('#sForm');
    if (sf) sf.onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(sf);
      try {
        await adminApi('/api/admin/settings', { method: 'PUT', body: {
          upi_id: f.get('upi_id'), payee_name: f.get('payee_name'), link_hours: Number(f.get('link_hours')),
          store_name: f.get('store_name'), support_email: f.get('support_email'),
          announcement: f.get('announcement'), auto_approve: f.get('auto_approve') ? '1' : '0',
          price_per_1k_stitches: Number(f.get('price_per_1k_stitches') || 50), min_price: Number(f.get('min_price') || 60),
          max_price: Number(f.get('max_price') || 500)
        } });
        const s = await adminApi('/api/settings'); Store.settings = { ...Store.settings, ...s.settings };
        window.toast('Settings saved', 'ok'); rerender();
      } catch (err) { window.toast(err.message, 'bad'); }
    };
    const pf = $('#pwForm');
    if (pf) pf.onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(pf);
      try {
        await adminApi('/api/admin/password', { method: 'POST', body: { current: f.get('current'), next: f.get('next') } });
        LS.removeItem(AK); window.toast('Password updated — sign in again', 'ok'); render(app, []);
      } catch (err) { window.toast(err.message, 'bad'); }
    };
    const rd = $('#resetDemo');
    if (rd) rd.onclick = () => { if (!confirm('Reset all demo data?')) return; window.Demo.reset(); window.toast('Demo data reset'); rerender(); };
  }

  window.Admin = { render };
})();

</script>
</body>
</html>
